# This brick's mise tasks, picked up by the root mise.toml. Without mise: see README.md.
#
# Compiles at --release 21 and runs unchanged on JDK 21.0.2 and JDK 26.0.1 — JEP 491 shipped in
# JDK 24, between the two. Each proof names both JDKs and fixes the carrier count at 2, so the
# numbers do not depend on this machine's core count.

["virtual-threads-pinning:build"]
description = "Compile the virtual-threads-pinning brick — release 21, so one artifact loads on both JVMs"
run = "brick build"

["virtual-threads-pinning:blocking-inside-synchronized"]
description = "Proof 1 — 64 virtual threads, each blocking inside its OWN synchronized lock: maxInside on JDK 21 vs JDK 26"
run = """brick proof BlockingInsideSynchronized \
  'java@openjdk-21.0.2 -Djdk.virtualThreadScheduler.parallelism=2 -Djdk.virtualThreadScheduler.maxPoolSize=2' \
  'java@26.0.1 -Djdk.virtualThreadScheduler.parallelism=2 -Djdk.virtualThreadScheduler.maxPoolSize=2'"""

["virtual-threads-pinning:blocking-inside-reentrant-lock"]
description = "Proof 2 — the control: the same shape with a ReentrantLock, same numbers on both JDKs"
run = """brick proof BlockingInsideReentrantLock \
  'java@openjdk-21.0.2 -Djdk.virtualThreadScheduler.parallelism=2 -Djdk.virtualThreadScheduler.maxPoolSize=2' \
  'java@26.0.1 -Djdk.virtualThreadScheduler.parallelism=2 -Djdk.virtualThreadScheduler.maxPoolSize=2'"""

["virtual-threads-pinning:shared-lock"]
description = "Proof 3 — one SHARED monitor: maxInside stays 1 on both JDKs, because this is contention, not pinning"
run = """brick proof SharedLock \
  'java@openjdk-21.0.2 -Djdk.virtualThreadScheduler.parallelism=2 -Djdk.virtualThreadScheduler.maxPoolSize=2' \
  'java@26.0.1 -Djdk.virtualThreadScheduler.parallelism=2 -Djdk.virtualThreadScheduler.maxPoolSize=2'"""

["virtual-threads-pinning:still-pins"]
description = "Proof 4 — does waiting for another thread's class init still pin, as the JEP 491 text says?"
run = """brick proof StillPins \
  'java@openjdk-21.0.2 -Djdk.virtualThreadScheduler.parallelism=2 -Djdk.virtualThreadScheduler.maxPoolSize=2' \
  'java@26.0.1 -Djdk.virtualThreadScheduler.parallelism=2 -Djdk.virtualThreadScheduler.maxPoolSize=2'"""

["virtual-threads-pinning"]
description = "The virtual-threads-pinning brick — JEP 491 changed the cost of synchronized, not its meaning"
run = "brick all blocking-inside-synchronized blocking-inside-reentrant-lock shared-lock still-pins"
