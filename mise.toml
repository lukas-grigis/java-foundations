# Every brick is a standalone Maven project that declares its own tasks in bricks/<slug>/tasks.toml,
# picked up by the glob below — a new brick needs no line in this file. Those tasks call bin/brick,
# the one runner that knows how to compile a brick and start a JVM. Nothing uses `mise x`: it runs
# the command in a subprocess whose working directory is not reliably the one you cd'd to.

[tools]
java = "27"
maven = "3"

[env]
_.path = ["{{config_root}}/bin"]

[task_config]
includes = ["bricks/*/tasks.toml"]

[tasks.build]
description = "Compile every brick, run nothing"
run = """
for f in bricks/*/tasks.toml; do
  b="${f%tasks.toml}"
  echo "==> $b"
  mise run -q "$(basename "$b"):build"
done
"""

[tasks.demo]
description = "Run every brick in turn"
run = """
for f in bricks/*/tasks.toml; do
  b="$(basename "${f%/tasks.toml}")"
  echo "========== $b =========="
  mise run "$b"
  echo
done
"""
